<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>intent 写法对比测试</title>
<style>
  body { font: 14px/1.7 monospace; padding: 20px; max-width: 900px; }
  button { display: block; margin: 6px 0; padding: 8px 12px; font: inherit; cursor: pointer; }
  #log { margin-top: 16px; padding: 10px; background: #f4f6fa; white-space: pre-wrap; font-size: 12px;
         max-height: 300px; overflow: auto; border: 1px solid #ddd; }
  .u { color: #06c; word-break: break-all; }
</style>
</head>
<body>
<p>点下面每个按钮，下面会记录浏览器实际发出的请求 URI。对比「期望」和「实际」。</p>

<button data-m="iframe-hash">A. iframe src = intent://settings/#Intent;...</button>
<button data-m="iframe-q">B. iframe src = intent://settings/?...</button>
<button data-m="loc-hash">C. location.href = intent://settings/#Intent;...</button>
<button data-m="a-hash">D. 建 a[href] 再 click()</button>
<button data-m="loc-noslash">E. location.href = intent://settings#Intent;...</button>
<button data-m="enc-iframe">F. iframe src = 全 URL 编码版</button>

<div id="log"></div>

<script>
(function(){
  "use strict";
  var log = document.getElementById("log");
  function p(s){ log.textContent += s + "\n"; }

  // 记录所有 intent 请求（用 Performance API 抓，避免递归监听）
  function flush(){
    try {
      var es = performance.getEntriesByType("resource")
        .map(function(e){ return e.name; })
        .filter(function(n){ return n.indexOf("intent:") === 0; });
      p("[最近 resource 里的 intent:] " + (es.join(" , ") || "(无 —— 浏览器不把 intent 当 resource 记)"));
    } catch(e){}
  }

  var full = "intent://settings/#Intent;scheme=android.settings;action=android.settings.WIFI_SETTINGS;end";

  function iframeSrc(uri){
    var f = document.createElement("iframe");
    f.style.display="none"; f.src = uri;
    document.body.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 150);
  }

  var methods = {
    "iframe-hash": function(){ iframeSrc(full); },
    "iframe-q":   function(){ iframeSrc("intent://settings/?Intent;scheme=android.settings;action=android.settings.WIFI_SETTINGS;end"); },
    "loc-hash":   function(){ window.location.href = full; },
    "a-hash": function(){
      var a = document.createElement("a");
      a.href = full; a.style.display="none";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 150);
    },
    "loc-noslash": function(){ window.location.href = "intent://settings#Intent;scheme=android.settings;action=android.settings.WIFI_SETTINGS;end"; },
    "enc-iframe": function(){ iframeSrc("intent%3A%2F%2Fsettings%2F%23Intent%3Bscheme%3Dandroid.settings%3Baction%3Dandroid.settings.WIFI_SETTINGS%3Bend"); }
  };

  document.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      var m = b.dataset.m;
      p("---- 点了 " + m + " ----");
      p("  期望: " + full);
      try { methods[m](); } catch(e){ p("  抛错: " + e); }
      setTimeout(flush, 300);
    });
  });
})();
</script>
</body>
</html>
